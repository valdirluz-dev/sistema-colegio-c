<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sistema Escolar</title>
    <style>
        /* Reset para garantir que o GoTTY não domine a página */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #2c3e50 !important; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .logo { color: #1abc9c; font-weight: bold; margin-bottom: 15px; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; }
        
        .window { 
            width: 900px; 
            height: 600px; 
            background: #000; 
            border-radius: 12px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 4px solid #34495e;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header { 
            background: #34495e; 
            padding: 10px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            color: #bdc3c7;
        }

        /* DIV ONDE O TERMINAL VAI RENDERIZAR */
        #terminal { 
    flex-grow: 1; 
    width: 100%;
    height: 100%;
    background: #000;
    position: relative; /* Importante para o posicionamento do iframe */
    overflow: hidden;
}

/* Força o conteúdo interno a se expandir */
#terminal iframe, #terminal xterm {
    width: 100% !important;
    height: 100% !important;
    border: none;
}
        .dots span { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .red { background: #ff5f56; } .yellow { background: #ffbd2e; } .green { background: #27c93f; }
    </style>
</head>
<body>

    <div class="logo">Sistema De Gestão Escolar</div>

    <div class="window">
        <div class="header">
            <div class="dots">
                <span class="red"></span><span class="yellow"></span><span class="green"></span>
            </div>
            <span style="font-size: 12px; font-weight: bold;">sistema-escolar:</span>
            <span></span>
        </div>
        <div id="terminal"></div>
    </div>

    <!-- 1. Configurações Globais que o GoTTY exige -->
    <script>
        var gotty_auth_token = "";
        var gotty_term = "xterm";
    </script>

    <!-- 2. Carregamento (Sem 'js/' na frente se estiverem na raiz, mas o GoTTY costuma exigir o js/) -->
    <script src="js/hterm.js"></script>
    <script src="js/gotty.js"></script>

    <!-- 3. Inicialização Forçada -->
    <script>
    function startTerminal() {
        var protocol = (window.location.protocol === 'https:') ? 'wss://' : 'ws://';
        var url = protocol + window.location.host + window.location.pathname + 'ws';
        var elem = document.getElementById('terminal');
        
        try {
            var gotty = new Gotty(elem, url, {
                fontSize: 16,
                fontFamily: "Courier New, monospace",
                enableKeyboard: true
            });
            
            // --- A MÁGICA ACONTECE AQUI ---
            gotty.onClose = function() {
                // 1. Tenta fechar a aba (só funciona se o script abriu a aba)
                window.close();

                // 2. Fallback: Se não fechar, limpa a interface e avisa o usuário
                document.body.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; color:#bdc3c7; background:#2c3e50;">
                        <h1 style="color:#1abc9c;">Sessão Encerrada</h1>
                        <p>O sistema escolar em C foi finalizado com sucesso.</p>
                        <button onclick="window.location.reload()" style="padding:10px 20px; background:#1abc9c; border:none; border-radius:5px; color:white; cursor:pointer;">Reiniciar Sistema</button>
                    </div>
                `;
            };

            gotty.open();

            // Força o redimensionamento inicial
            setTimeout(function() {
                if (gotty.resize) gotty.resize();
            }, 500);

            window.addEventListener('resize', function() {
                if (gotty.resize) gotty.resize();
            });

        } catch (e) {
            console.error("Erro ao iniciar Gotty:", e);
        }
    }

    window.addEventListener('load', function() {
        setTimeout(startTerminal, 200);
    });
</script>
</body>
</html>
