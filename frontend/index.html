<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sistema Escolar</title>
    <!-- Importa o CSS do Xterm -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/css/xterm.css" />
    <style>
        body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .window { width: 800px; height: 500px; margin-top: 50px; border: 2px solid #333; border-radius: 8px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .header { background: #333; color: #aaa; padding: 8px; font-size: 12px; text-align: center; }
        #terminal { width: 100%; height: 100%; background: #000; padding: 10px; }
    </style>
</head>
<body>
    <h2 style="color:#00ffcc">SISTEMA ESCOLAR EM C</h2>
    <div class="window">
        <div class="header">Controle de Alunos e Professores</div>
        <div id="terminal"></div>
    </div>

    <!-- Scripts de comunicação -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const term = new Terminal({
            cursorBlink: true,
            theme: { background: '#000' }
        });
        const socket = io();

        term.open(document.getElementById('terminal'));

        // Envia dados do teclado para o servidor
        term.onData(data => socket.emit('input', data));

        // Recebe dados do servidor e mostra no terminal
        socket.on('output', data => term.write(data));
    </script>
</body>
</html>
