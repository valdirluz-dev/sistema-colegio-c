<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sistema Escolar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/css/xterm.css" />
    <style>
        body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; transition: background 0.5s; }
        .window { width: 800px; height: 500px; margin-top: 50px; border: 2px solid #333; border-radius: 8px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .header { background: #333; color: #aaa; padding: 8px; font-size: 12px; text-align: center; }
        #terminal { width: 100%; height: 100%; background: #000; padding: 10px; }
        .desligado { color: #00ffcc; text-align: center; margin-top: 100px; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <h2 id="titulo" style="color:#00ffcc">SISTEMA DE GESTÃO ESCOLAR</h2>
    <div id="container-principal" class="window">
        <div class="header">Painel de Controle</div>
        <div id="terminal"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const term = new Terminal({ cursorBlink: true, theme: { background: '#000' } });
        const socket = io({ reconnection: false }); // Desabilita reconexão para o evento disparar na hora

        term.open(document.getElementById('terminal'));

        term.onData(data => socket.emit('input', data));
        socket.on('output', data => term.write(data));

        // FUNÇÃO DE ENCERRAMENTO
        function finalizarInterface() {
            console.log("Encerrando...");
            // Substitui todo o conteúdo do body
            document.body.innerHTML = `
                <div class="desligado">
                    <h1 style="font-size: 80px;">OFFLINE</h1>
                    <h2>O programa foi encerrado.</h2>
                    <p style="color: #888;">O container Docker parou de rodar.</p>
                    <button onclick="window.location.reload()" 
                            style="margin-top:20px; padding:15px 30px; background:#00ffcc; border:none; 
                                   border-radius:5px; font-weight:bold; cursor:pointer; color:#1a1a1a;">
                        RECONECTAR
                    </button>
                </div>
            `;
            document.body.style.background = "#000";
        }

        // Se o servidor avisar que vai fechar
        socket.on('server-closed', () => finalizarInterface());

        // Se a conexão cair de vez
        socket.on('disconnect', () => finalizarInterface());
    </script>
</body>
</html>
